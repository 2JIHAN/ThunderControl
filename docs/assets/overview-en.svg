<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc"><title id="title">One cable. Two Macs.</title><desc id="desc">Separate authenticated input and video connections over a direct 1:1 bridge.</desc><defs><marker id="green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#128c78" stroke-width="2"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#7761c8" stroke-width="2"/></marker></defs><rect x="1" y="1" width="1098" height="378" rx="24" fill="#fafbfc" stroke="#dde3e9"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif" text-anchor="middle"><text x="550" y="46" font-size="26" font-weight="700" fill="#182733">One cable. Two Macs.</text><text x="550" y="74" font-size="15" fill="#5c6b77">Your MacBook controls. Your Mac mini runs the apps.</text><rect x="80" y="112" width="235" height="143" rx="12" fill="#e3e9ef" stroke="#8999a8" stroke-width="2"/><rect x="92" y="123" width="211" height="120" rx="6" fill="#fff"/><rect x="112" y="142" width="90" height="9" rx="4" fill="#e2e9ee"/><rect x="112" y="163" width="166" height="8" rx="4" fill="#e9eef3"/><rect x="112" y="181" width="141" height="8" rx="4" fill="#e9eef3"/><rect x="112" y="205" width="58" height="17" rx="5" fill="#d4eee8"/><path d="M65 255H330L315 267H80Z" fill="#c6d0da" stroke="#8999a8"/><text x="198" y="297" font-size="23" font-weight="650" fill="#182733">MacBook</text><text x="198" y="321" font-size="15" fill="#5c6b77">Keyboard and trackpad</text><rect x="816" y="132" width="199" height="113" rx="25" fill="#e2e8ee" stroke="#8999a8" stroke-width="2"/><rect x="840" y="157" width="151" height="63" rx="12" fill="#f9fbfd"/><circle cx="987" cy="230" r="3" fill="#128c78"/><text x="916" y="297" font-size="23" font-weight="650" fill="#182733">Mac mini</text><text x="916" y="321" font-size="15" fill="#5c6b77">Apps and virtual display</text><path d="M350 144H775" stroke="#128c78" stroke-width="3" marker-end="url(#green)"/><text x="562" y="127" font-size="15" font-weight="600" fill="#128c78">Keyboard, pointer and scroll</text><path d="M779 255H355" stroke="#7761c8" stroke-width="3" marker-end="url(#purple)"/><text x="562" y="285" font-size="15" font-weight="600" fill="#7761c8">View-only HiDPI video</text><rect x="435" y="178" width="255" height="43" rx="21" fill="#fff" stroke="#d6dee7"/><text x="562" y="205" font-size="17" font-weight="600" fill="#334959">Thunderbolt Bridge</text><text x="550" y="358" font-size="13" fill="#6d7c88">Separate authenticated input and video connections over a direct 1:1 bridge.</text></g></svg>
